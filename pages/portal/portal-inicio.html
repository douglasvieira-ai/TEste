<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Cliente — Início</title>
  <style>
    * { box-sizing: border-box; }
    :root{
      --azul: #007AFF; --azul-inst: #0a4bd1; --azul-claro: #EAF2FD;
      --cinza-bg: #EAF1FB; --texto: #1A1D1F; --texto-sec: #6B7280; --borda: #E6E9EF;
      --sidebar-w: 272px; --verde: #1E9E62; --amarelo: #C98A00; --vermelho: #E5342E;
      --card-radius: 16px;
    }
    html, body { height: 100%; }
    body { margin: 0; font-family: "Inter","Segoe UI",system-ui,-apple-system,sans-serif; color: var(--texto); background: var(--cinza-bg); }
    .portal { display: flex; flex-direction: column; min-height: 100vh; }

    /* ===== Header ===== */
    .portal-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 28px; background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 20; }
    .portal-header__left { display: flex; align-items: center; gap: 20px; min-width: 0; }
    .brand-logo-link { text-decoration: none; cursor: pointer; display: inline-flex; }
    .brand-araujo { font-weight: 800; font-size: 26px; letter-spacing: 1px; color: #E5342E; line-height: 1; position: relative; padding-bottom: 5px; font-family: "Arial Black", "Inter", sans-serif; }
    .brand-araujo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #054685; border-radius: 2px; }
    .header-divider { width: 1px; height: 30px; background: var(--borda); }
    .header-section-title { font-size: 17px; font-weight: 600; color: var(--texto); }
    .user-box { display: flex; align-items: center; gap: 14px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--azul); flex-shrink: 0; }
    .user-meta { display: flex; flex-direction: column; line-height: 1.3; }
    .user-name { font-size: 14px; font-weight: 700; color: var(--texto); }
    .user-email { font-size: 12px; color: var(--texto-sec); }
    .btn-logout { width: 40px; height: 40px; border: none; background: transparent; border-radius: 10px; cursor: pointer; color: var(--azul); display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .btn-logout:hover { background: var(--azul-claro); }

    .portal-body { display: flex; flex: 1 1 auto; min-height: 0; }

    /* ===== Sidebar ===== */
    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: #fff; border-right: 1px solid var(--borda); padding: 18px 14px; overflow-y: auto; }
    .nav-section { margin-bottom: 20px; }
    .nav-section__title { font-size: 12px; font-weight: 600; letter-spacing: .3px; color: #9AA0A6; padding: 6px 12px; margin: 0 0 4px; }
    .nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer; color: var(--texto); font-size: 14px; text-decoration: none; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; transition: background .15s, color .15s; }
    .nav-item:hover { background: #F4F6FA; }
    .nav-item.active { background: var(--azul-claro); color: var(--azul); font-weight: 600; }
    .nav-item.active .nav-icon { color: var(--azul); }
    .nav-icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--texto-sec); display: flex; }
    .nav-icon svg { width: 100%; height: 100%; display: block; }
    .nav-label { flex: 1 1 auto; min-width: 0; }
    .nav-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--vermelho); flex-shrink: 0; }

    /* ===== Main ===== */
    .main { flex: 1 1 auto; padding: 24px; display: flex; min-width: 0; }
    .board { background: #fff; border-radius: 20px; padding: 30px 34px; width: 100%; box-shadow: 0 10px 30px rgba(10,40,120,.06); display: flex; flex-direction: column; gap: 26px; }

    /* Hero */
    .hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .hero h1 { margin: 0 0 6px; font-size: 30px; font-weight: 700; color: var(--texto); }
    .hero p { margin: 0; color: var(--texto-sec); font-size: 15px; }
    .btn-hero { background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; line-height: 0; border-radius: 8px; transition: transform .15s, filter .15s; }
    .btn-hero:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .btn-hero img { display: block; width: 150px; height: 42px; }

    /* Dashboard grid */
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    /* Permite que as duas colunas respeitem 1fr igualmente (sem o conteúdo dos thumbs
       esticar a coluna de "Meus pedidos" e desalinhar com "Meus chamados"). */
    .dashboard > .panel, .dashboard > .right-col { min-width: 0; }

    .panel { border: 1px solid var(--borda); border-radius: var(--card-radius); padding: 20px; background: #fff; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel__title { display: flex; align-items: center; gap: 12px; }
    .panel__icon { width: 40px; height: 40px; border-radius: 10px; background: var(--azul-claro); color: var(--azul); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .panel__icon svg { width: 22px; height: 22px; }
    .panel__title h2 { margin: 0; font-size: 18px; font-weight: 700; }
    .panel__link { color: var(--azul); font-size: 14px; font-weight: 600; text-decoration: none; }
    .panel__link:hover { text-decoration: underline; }
    .panel__body { display: flex; flex-direction: column; gap: 14px; }

    /* Tabs (agendamentos / manipulados) */
    .panel--tabs { padding-top: 0; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--borda); margin: 0 -20px; padding: 0 20px; }
    .tab { appearance: none; border: none; background: none; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--texto-sec); padding: 16px 14px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab .tab-ic { width: 22px; height: 22px; display: inline-flex; color: inherit; }
    .tab .tab-ic svg { width: 100%; height: 100%; }
    .tab.active { color: var(--texto); border-bottom-color: var(--azul); }
    .tab.active .tab-ic { color: var(--azul); }

    /* Item cards (order / chamado / agendamento) */
    .item-card { position: relative; border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: box-shadow .15s, border-color .15s; background: #fff; }
    .item-card:hover { box-shadow: 0 6px 18px rgba(10,40,120,.08); border-color: #d7deea; }
    .item-card__dot { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--vermelho); }
    .item-card__chevron { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #B4BCCA; display: flex; }
    .item-card__chevron svg { width: 22px; height: 22px; }

    .status-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
    .status-chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
    .status--separacao { color: var(--azul); }
    .status--resposta  { color: var(--azul); }
    .status--agendado  { color: var(--azul); }
    .status--pronto    { color: var(--verde); }
    .status--transportadora { color: var(--verde); }
    .status--motociclista   { color: var(--verde); }
    .status--entregue  { color: var(--verde); }
    .status--atendimento { color: var(--amarelo); }

    .item-meta { display: flex; gap: 40px; margin-top: 12px; flex-wrap: wrap; }
    .item-meta__col { display: flex; flex-direction: column; gap: 2px; }
    .item-meta__label { font-size: 12px; color: #9AA0A6; }
    .item-meta__value { font-size: 14px; font-weight: 600; color: var(--texto); display: inline-flex; align-items: center; gap: 6px; }
    .item-meta__value svg { width: 16px; height: 16px; }

    /* Thumbnail strip */
    .thumbs { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-right: 30px; }
    .thumb { width: 54px; height: 54px; border: 1px solid var(--borda); border-radius: 10px; background: #F7F9FC; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .thumb img { max-width: 100%; max-height: 100%; }
    .thumb--placeholder { color: #C4CBD6; }
    .thumb--placeholder svg { width: 26px; height: 26px; }
    .thumb--more { font-size: 14px; font-weight: 700; color: var(--texto-sec); background: #fff; }

    .right-col { display: flex; flex-direction: column; gap: 24px; }

    /* Elementos exclusivos do mobile (ocultos no desktop) */
    .mobile-back, .mobile-menu, .brand-araujo-mini, .hero-fale-mobile { display: none; }

    @media (max-width: 1040px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    /* ===== Layout MOBILE (segue o design "Inicio area do cliente" do mobile) ===== */
    @media (max-width: 768px) {
      html, body { background: #fff; overflow-x: hidden; width: 100%; margin: 0; }
      .portal { width: 100%; max-width: 100%; overflow-x: hidden; }
      .portal-body { display: block; width: 100%; max-width: 100%; }
      .main, .board, .dashboard { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 82%; max-width: 320px; z-index: 40; transform: translateX(-100%); transition: transform .25s; box-shadow: 4px 0 24px rgba(0,0,0,.18); }
      .sidebar.open { transform: translateX(0); }

      /* Header mobile: ‹ voltar · logo quadrado · título centralizado · hambúrguer */
      .portal-header { width: 100%; max-width: 100%; box-sizing: border-box; padding: 10px 12px; gap: 8px; }
      .mobile-back { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: none; background: transparent; color: #3A4046; cursor: pointer; flex-shrink: 0; }
      .mobile-back svg { width: 24px; height: 24px; }
      .mobile-menu { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: none; background: transparent; color: #054685; cursor: pointer; flex-shrink: 0; }
      .mobile-menu svg { width: 24px; height: 24px; }
      .portal-header__left { flex: 1 1 auto; justify-content: center; gap: 2.5px; min-width: 0; }
      .header-divider { display: none; }
      .brand-araujo { display: none; }
      /* Logo "A" (igual ao [ds]-top-bar-page.svg): A vermelho com barra azul em cima e embaixo */
      .brand-araujo-mini { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 30px; color: #E5342E; font-weight: 800; font-size: 20px; position: relative; padding: 4px 0; font-family: "Arial Black","Inter",sans-serif; line-height: 1; }
      .brand-araujo-mini::before { content: ""; position: absolute; left: 2px; right: 2px; top: 1px; height: 2.5px; background: #054685; border-radius: 1px; }
      .brand-araujo-mini::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 1px; height: 2.5px; background: #054685; border-radius: 1px; }
      .header-section-title { width: 238px; height: 19px; font-size: 17px; font-weight: 600; text-align: center; line-height: 19px; }
      .user-box { display: none; }

      /* Main: tela única empilhada (sem card branco externo) */
      .main { padding: 0; overflow-x: hidden; }
      .board { border-radius: 0; box-shadow: none; padding: 16px; gap: 20px; background: #fff; overflow-x: hidden; }
      .panel, .panel__body, .item-card { max-width: 100%; min-width: 0; box-sizing: border-box; }
      .panel__head { min-width: 0; }
      .panel__title { min-width: 0; }
      .panel__title h2 { white-space: nowrap; }

      /* Hero: título + subtítulo + botão Fale Conosco de largura total */
      .hero { flex-direction: column; align-items: stretch; gap: 4px; }
      .hero h1 { font-size: 24px; }
      .hero p { font-size: 14px; }
      .btn-hero { display: none; }  /* imagem do botão desktop oculta no mobile */
      .hero-fale-mobile {
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        margin-top: 8px; height: 50px; border-radius: 12px; background: var(--azul); color: #fff;
        font-size: 16px; font-weight: 700; text-decoration: none; font-family: inherit;
      }
      .hero-fale-mobile svg { width: 22px; height: 22px; }

      /* Dashboard: coluna única, painéis empilhados */
      .dashboard { display: flex; flex-direction: column; gap: 18px; }
      .right-col { gap: 18px; }
      .panel { border-radius: 16px; box-shadow: 0 4px 16px rgba(10,40,120,.05); }

      /* Status vira pill com fundo colorido */
      .status-chip { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
      .status-chip::before { width: 8px; height: 8px; }
      .status--separacao, .status--resposta, .status--agendado { background: #E9F2FF; }
      .status--pronto, .status--transportadora, .status--motociclista, .status--entregue { background: #E7F6EE; }
      .status--atendimento { background: #FBF1D6; }
      .item-meta { gap: 24px; }

      /* Miniaturas: no mobile mostra só 3 (o resto vira "+N"), sem estourar a largura */
      .item-card { overflow: hidden; }
      .thumbs { padding-right: 24px; }
      .thumb { width: 46px; height: 46px; }
      .thumbs .thumb--placeholder:nth-of-type(n+4) { display: none; }
      .item-card__chevron { right: 2px; }
    }

    /* =========================================================
       AGENTE / DRAWER DE CHAT (embutido — igual ao da home)
       ========================================================= */
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .agent-overlay { position: fixed; inset: 0; background: rgba(10,25,60,.35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9997; }
    .agent-overlay.show { opacity: 1; pointer-events: auto; }
    .agent { position: fixed; bottom: 30px; right: 30px; width: 420px; height: calc(100vh - 100px); max-height: 860px; z-index: 9998; display: flex; flex-direction: column; background: #fff; border-radius: 16px; overflow: hidden; box-sizing: border-box; transform: translateY(20px) scale(.96); opacity: 0; pointer-events: none; transform-origin: bottom right; transition: transform .4s cubic-bezier(0.22,1,0.36,1), opacity .3s, width .4s cubic-bezier(0.22,1,0.36,1), height .4s cubic-bezier(0.22,1,0.36,1), bottom .4s, right .4s, top .4s, left .4s; box-shadow: 0 18px 50px rgba(0,40,120,.28); }
    .agent.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
    .agent.expanded { top: 50%; left: 50%; right: auto; bottom: auto; width: min(960px, 82vw); height: min(840px, calc(100vh - 48px)); transform: translate(-50%,-50%) scale(1); transform-origin: center; }
    @media (max-width: 768px) {
      .agent-overlay { background: rgba(0,0,0,.30); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
      .agent, .agent.expanded { top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: 90%; max-height: 90%; display: flex; flex-direction: column; border-radius: 16px 16px 0 0; transform: translateY(100%); transform-origin: bottom center; }
      .agent.open, .agent.expanded.open { transform: translateY(0); }
      .agent::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; border-radius: 2px; background: #d0d3d9; z-index: 5; }
      .chat-header { padding-top: 22px; justify-content: center; position: relative; }
      .chat-header__actions { display: none !important; }
      .chat-header__brand { margin: 0 auto !important; }
    }
    .chat-header { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid #eef0f3; }
    .chat-header__brand { display: flex; align-items: center; }
    .chat-header__brand img { display: block; height: 16px; max-height: 16px; width: auto; }
    .chat-header__actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .chat-iconbtn { width: 30px; height: 30px; border: none; background: transparent; color: #5f6368; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .chat-iconbtn:hover { background: rgba(0,0,0,.06); color: #202124; }
    .chat-iconbtn img { display: block; }
    .chat-iconbtn .icon-collapse { display: none; }
    .agent.expanded .chat-iconbtn .icon-expand { display: none; }
    .agent.expanded .chat-iconbtn .icon-collapse { display: block; }
    .pill-icon { display: block; flex-shrink: 0; }
    .chat-scroll { flex: 1 1 auto; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
    .agent.expanded .chat-scroll { padding: 18px 80px; }
    .welcome { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
    .agent.started .welcome { display: none; }
    .chat-greeting { text-align: center; color: #202124; margin: 6px 0 2px; }
    .chat-greeting h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .chat-greeting p  { margin: 4px 0 0; font-size: 14px; color: #5f6368; }
    .pills-chat { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; width: 100%; margin: 4px 0 2px; }
    .pill-chat { border: 1px solid #d9dde3; background: #fff; color: #0a2a5e; border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: background .15s, border-color .15s; }
    .pill-chat:hover { background: #f2f6ff; border-color: #a9c6ff; }
    .agent.expanded .pills-chat { justify-content: center; }
    .messages { display: flex; flex-direction: column; gap: 10px; }
    .msg { font-size: 14px; line-height: 1.5; }
    .msg.bot  { align-self: stretch; max-width: 100%; color: #202124; background: none; border: none; padding: 0; }
    .msg.user { align-self: flex-end; max-width: 82%; background: #E6F2FF; color: #0a2a5e; padding: 9px 13px; border-radius: 14px; border-bottom-right-radius: 4px; }
    .msg.typing { align-self: flex-start; color: #5f6368; background: none; border: none; padding: 0; display: flex; align-items: center; gap: 8px; }
    .dot-wave { display: inline-flex; gap: 4px; }
    .dot-wave span { width: 6px; height: 6px; border-radius: 50%; background: #0059ff; animation: dotwave 1.2s ease-in-out infinite; }
    .dot-wave span:nth-child(2){ animation-delay:.15s } .dot-wave span:nth-child(3){ animation-delay:.3s }
    @keyframes dotwave { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-5px);opacity:1} }
    .chat-input-container { flex-shrink: 0; width: 100%; box-sizing: border-box; padding: 16px 16px 24px; background: #fff; position: relative; }
    .agent.expanded .chat-input-container { padding: 16px 80px 24px; }
    .input-field { position: relative; width: 70%; margin: 0 auto; min-height: 48px; border-radius: 24px; background: #fff; display: flex; align-items: center; padding: 4px 8px; gap: 6px; border: 1px solid #B2B2BC; box-sizing: border-box; transition: width .3s cubic-bezier(0.22,1,0.36,1), border-color .15s, background-color .15s; }
    .input-field.engaged, .input-field:focus-within, .input-field.has-content, .input-field.recording, .input-field.has-image, .input-field.dragover { width: 100%; }
    .agent.expanded .input-field { min-height: 56px; }
    .input-field::before { content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px; background: conic-gradient(from var(--angle), transparent 0deg, transparent 200deg, #007aff 280deg, #00e5ff 330deg, #fff 350deg, #00e5ff 360deg); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; opacity: 0; transition: opacity .35s; animation: spin 3.2s linear infinite; pointer-events: none; }
    .input-field::after { content:""; position:absolute; inset:-4px; border-radius:inherit; box-shadow:0 0 4px 0 rgba(0,200,255,.08); opacity:0; transition:opacity .35s; pointer-events:none; }
    .input-field:focus-within::before, .input-field:hover::before, .input-field.recording::before { opacity: 1; }
    .input-field:focus-within::after, .input-field:hover::after, .input-field.recording::after { opacity: 1; }
    @keyframes spin { to { --angle: 360deg; } }
    .btn-add { flex-shrink:0; width:28px; height:28px; border:none; background:transparent; color:#5f6368; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .btn-add:hover { background: rgba(0,0,0,.05); }
    .text-input { flex:1; border:none; outline:none; background:transparent; font-size:14px; color:#202124; font-family:inherit; min-width:0; }
    .text-input::placeholder { color:#9aa0a6; }
    .btn-mic { flex-shrink:0; width:30px; height:30px; border:none; background:transparent; cursor:pointer; color:#5f6368; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .btn-mic:hover { background: rgba(0,0,0,.05); color:#000; }
    .waveform { flex:1; height:30px; display:flex; align-items:center; justify-content:center; gap:3px; overflow:hidden; min-width:0; }
    .waveform .bar { width:3px; min-height:3px; border-radius:3px; background:#1a73e8; animation: wave 1.1s ease-in-out infinite; }
    @keyframes wave { 0%,100%{height:4px;opacity:.55} 50%{height:20px;opacity:1} }
    .btn-stop { flex-shrink:0; width:32px; height:32px; border:1.5px solid #cfcfd4; background:#fff; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .btn-stop .square { width:10px; height:10px; border-radius:2px; background:#3c4043; }
    .btn-send { flex-shrink:0; width:34px; height:34px; border:none; border-radius:50%; background:#1a73e8; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; }
    .btn-send:hover { background:#1765cc; }
    .btn-send-text { flex-shrink:0; width:34px; height:34px; border:none; border-radius:50%; background:#1a73e8; cursor:pointer; display:none; align-items:center; justify-content:center; }

      { status:'separacao', statusLabel:'Pedido em separação', numero:'APP6191911', data:'01/08', tipo:'Retirada', tipoIcon:ICON.retirada, dot:true, extra:3 },
      { status:'pronto', statusLabel:'Pronto para retirada', numero:'APP6191911', data:'01/08', tipo:'Retirada', tipoIcon:ICON.retirada, dot:true, extra:0 },
      { status:'transportadora', statusLabel:'Entregue a transportadora', numero:'APP6191911', data:'01/08', tipo:'Entrega', tipoIcon:ICON.entrega, dot:true, extra:0 },
      { status:'motociclista', statusLabel:'Entregue ao motociclista', numero:'APP6191911', data:'01/08', tipo:'Entrega', tipoIcon:ICON.entrega, dot:true, extra:0 }
    ];
    const CHAMADOS = [
      { status:'atendimento', statusLabel:'Aguardando atendimento', numero:'CHA000001', motivo:'Devolução', dot:true },
      { status:'atendimento', statusLabel:'Aguardando atendimento', numero:'CHA000001', motivo:'Devolução', dot:true },
      { status:'resposta', statusLabel:'Aguardando resposta', numero:'CHA000001', motivo:'Devolução', dot:false }
    ];
    const AGENDAMENTOS = [
      { status:'atendimento', statusLabel:'Agendamento pendente', numero:'APP6191911', data:'01/08', local:'Loja', item:'Vacina Gripe Efluelda Tetravalete 2025', extra:1 }
    ];
    const MANIPULADOS = [
      { status:'separacao', statusLabel:'Em manipulação', numero:'MAN000123', data:'01/08', local:'Loja', item:'Fórmula manipulada — Minoxidil 5%', extra:0 }
    ];

    // ===== Templates =====
    function thumbsHTML(extra){
      let t = '';
      for (let i=0;i<5;i++) t += `<span class="thumb thumb--placeholder">${ICON.pill}</span>`;
      if (extra>0) t += `<span class="thumb thumb--more">+${extra}</span>`;
      return `<div class="thumbs">${t}</div>`;
    }
    function pedidoCard(p){
      return `
        <article class="item-card">
          ${p.dot?'<span class="item-card__dot"></span>':''}
          <span class="status-chip status--${p.status}">${p.statusLabel}</span>
          <div class="item-meta">
            <div class="item-meta__col"><span class="item-meta__label">N° do pedido</span><span class="item-meta__value">${p.numero}</span></div>
            <div class="item-meta__col"><span class="item-meta__label">Data</span><span class="item-meta__value">${p.data}</span></div>
            <div class="item-meta__col"><span class="item-meta__label">&nbsp;</span><span class="item-meta__value">${p.tipoIcon}${p.tipo}</span></div>
          </div>
          ${thumbsHTML(p.extra)}
          <span class="item-card__chevron">${ICON.chevron}</span>
        </article>`;
    }
    function chamadoCard(c){
      return `
        <article class="item-card">
          ${c.dot?'<span class="item-card__dot"></span>':''}
          <span class="status-chip status--${c.status}">${c.statusLabel}</span>
          <div class="item-meta">
            <div class="item-meta__col"><span class="item-meta__label">N° do chamado</span><span class="item-meta__value">${c.numero}</span></div>
            <div class="item-meta__col"><span class="item-meta__label">Motivo</span><span class="item-meta__value">${c.motivo}</span></div>
          </div>
          <span class="item-card__chevron">${ICON.chevron}</span>
        </article>`;
    }
    function agendaCard(a){
      return `
        <article class="item-card">
          <span class="status-chip status--${a.status}">${a.statusLabel}</span>
          <div class="item-meta">
            <div class="item-meta__col"><span class="item-meta__label">N° do pedido</span><span class="item-meta__value">${a.numero}</span></div>
            <div class="item-meta__col"><span class="item-meta__label">Data agendada</span><span class="item-meta__value">${a.data}</span></div>
            <div class="item-meta__col"><span class="item-meta__label">&nbsp;</span><span class="item-meta__value">${ICON.loja}${a.local}</span></div>
          </div>
          <div class="thumbs">
            <span class="thumb thumb--placeholder">${ICON.vacina}</span>
            <span class="item-meta__value" style="flex:1;font-weight:600;">${a.item}</span>
            ${a.extra>0?`<span class="thumb thumb--more">+${a.extra}</span>`:''}
            <span class="item-card__chevron" style="position:static;transform:none;">${ICON.chevron}</span>
          </div>
        </article>`;
    }

    // ===== Render =====
    function renderSidebar(){
      document.getElementById('sidebar').innerHTML = SIDEBAR.map(sec => `
        <div class="nav-section"><p class="nav-section__title">${sec.titulo}</p>
          <ul class="nav-list">${sec.itens.map(it => {
            const inner = `<span class="nav-icon">${it.icon}</span><span class="nav-label">${it.label}</span>${it.dot?'<span class="nav-dot"></span>':''}`;
            return it.href && it.href !== '#'
              ? `<li><a class="nav-item${it.active?' active':''}" href="${it.href}">${inner}</a></li>`
              : `<li><button class="nav-item${it.active?' active':''}" type="button">${inner}</button></li>`;
          }).join('')}</ul>
        </div>`).join('');
    }
    function renderPedidos(){ document.getElementById('listaPedidos').innerHTML = PEDIDOS.map(pedidoCard).join(''); }
    function renderChamados(){ document.getElementById('listaChamados').innerHTML = CHAMADOS.map(chamadoCard).join(''); }
    function renderTab(tab){
      const box = document.getElementById('listaTab');
      const dados = tab === 'manipulados' ? MANIPULADOS : AGENDAMENTOS;
      box.innerHTML = dados.map(agendaCard).join('');
    }
    function setupTabs(){
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(t => t.addEventListener('click', () => {
        tabs.forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        renderTab(t.dataset.tab);
      }));
    }
    function fillUser(){
      document.getElementById('userName').textContent = USER.headerNome;
      document.getElementById('userEmail').textContent = USER.email;
      document.getElementById('heroName').textContent = USER.nome;
    }

    renderSidebar();
    renderPedidos();
    renderChamados();
    renderTab('agendamentos');
    setupTabs();
    fillUser();
    document.getElementById('btnLogout').addEventListener('click', ()=> alert('Sair / Logout'));

    // Mobile: hambúrguer abre/fecha a sidebar
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebarEl = document.getElementById('sidebar');
    if (mobileMenuBtn && sidebarEl) {
      mobileMenuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); sidebarEl.classList.toggle('open'); });
      document.addEventListener('click', (e)=>{ if (sidebarEl.classList.contains('open') && !sidebarEl.contains(e.target) && e.target !== mobileMenuBtn && !mobileMenuBtn.contains(e.target)) sidebarEl.classList.remove('open'); });
    }

    // Botões "Fale Conosco" (hero desktop + hero mobile) abrem a drawer do agente
    ['btnFaleHero','btnFaleHeroMobile'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.addEventListener('click', function(e){ e.preventDefault(); if (typeof openAgent === 'function') openAgent(); });
    });
  </script>

  <!-- ===== Script do Agente / Drawer de chat (embutido) ===== -->
  <script>
    const agent=document.getElementById('agent'), overlay=document.getElementById('agentOverlay');
    const btnExpand=document.getElementById('btnExpand'), btnClose=document.getElementById('btnClose');
    const inputField=document.getElementById('inputField'), textInput=document.getElementById('textInput');
    const btnMic=document.getElementById('btnMic'), btnStop=document.getElementById('btnStop'), btnSend=document.getElementById('btnSend');
    const btnSendText=document.getElementById('btnSendText');
    const btnAdd=document.getElementById('btnAdd'), fileInput=document.getElementById('fileInput');
    const attachMenu=document.getElementById('attachMenu');
    const attachPreview=document.getElementById('attachPreview'), attachThumb=document.getElementById('attachThumb'), attachRemove=document.getElementById('attachRemove');
    const imgModal=document.getElementById('imgModal'), imgModalImg=document.getElementById('imgModalImg');
    const imgModalClose=document.getElementById('imgModalClose'), imgModalBackdrop=document.getElementById('imgModalBackdrop');
    const imgSave=document.getElementById('imgSave'), imgCopy=document.getElementById('imgCopy');
    const imgFeedback=document.getElementById('imgFeedback'), imgFeedbackImg=document.getElementById('imgFeedbackImg');
    const waveform=document.getElementById('waveform'), agentBody=document.getElementById('agentBody');
    const chatScroll=document.getElementById('chatScroll');

    let pendingImage = null;
    const AUDIO_TRANSCRICAO = 'Quero saber o status do meu pedido';
    const PRODUTO_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
         <rect width="300" height="300" fill="#f3f4f7"/>
         <rect x="90" y="70" width="120" height="170" rx="10" fill="#dfe6f3"/>
         <text x="150" y="160" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#0a2a5e" text-anchor="middle">Aptamil</text>
         <text x="150" y="186" font-family="Inter,Arial" font-size="16" fill="#5f6368" text-anchor="middle">Pepti</text>
       </svg>`);

    for (let i=0;i<26;i++){ const b=document.createElement('span'); b.className='bar'; b.style.animationDelay=`-${(i*0.055).toFixed(3)}s`; b.style.animationDuration=`${(0.9+(i%5)*0.08).toFixed(2)}s`; waveform.appendChild(b); }

    const isMobile = ()=> window.matchMedia('(max-width: 768px)').matches;
    function openAgent(){
      agent.classList.add('open'); agent.setAttribute('aria-hidden','false');
      if(isMobile()) overlay.classList.add('show');
      setTimeout(()=>textInput.focus({preventScroll:true}),350);
    }
    window.openAgent = openAgent;
    function closeAgent(){ agent.classList.remove('open','expanded','processing','started'); agent.setAttribute('aria-hidden','true'); overlay.classList.remove('show'); inputField.classList.remove('recording','has-content','engaged'); agentBody.innerHTML=''; textInput.value=''; attachMenu.classList.remove('open'); pendingImage=null; attachPreview.hidden=true; attachThumb.removeAttribute('src'); inputField.classList.remove('has-image'); }
    btnClose.addEventListener('click', closeAgent);

    document.addEventListener('pointerdown', (event)=>{
      if(!agent.classList.contains('open')) return;
      if(agent.classList.contains('expanded')) return;
      if(isMobile()) return;
      var dentroDrawer = event.target.closest('.chat-header, .chat-scroll, .chat-input-container, .agent');
      var noImgModal = event.target.closest('#imgModal');
      var noBotaoFale = event.target.closest('#btnFaleHero, #btnFaleHeroMobile');
      if(!dentroDrawer && !noImgModal && !noBotaoFale){ btnClose.click(); }
    });

    function startChat(){ agent.classList.add('started'); }
    function updateInputState(){ inputField.classList.toggle('has-content', textInput.value.trim().length > 0 || !!pendingImage); }
    function maybeResetWelcome(){
      var temConversa = agentBody.children.length > 0;
      var gravando = inputField.classList.contains('recording');
      var temTexto = textInput.value.trim().length > 0;
      if (!temConversa && !gravando && !temTexto) agent.classList.remove('started');
    }

    btnExpand.addEventListener('click', ()=>{ agent.classList.toggle('expanded'); overlay.classList.toggle('show', agent.classList.contains('expanded')); });
    overlay.addEventListener('click', ()=>{ if(isMobile()){ closeAgent(); } else { agent.classList.remove('expanded'); overlay.classList.remove('show'); } });

    inputField.addEventListener('pointerdown', ()=>{ inputField.classList.add('engaged'); }, true);
    inputField.addEventListener('focusout', ()=>{
      setTimeout(()=>{
        if (inputField.contains(document.activeElement)) return;
        var ocioso = !inputField.classList.contains('recording') && !inputField.classList.contains('has-image') && !textInput.value.trim() && !pendingImage;
        if (ocioso) inputField.classList.remove('engaged');
      }, 0);
    });

    textInput.addEventListener('input', ()=>{ updateInputState(); if(textInput.value.length) startChat(); else maybeResetWelcome(); });
    textInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && (textInput.value.trim() || pendingImage)){ sendText(); } });
    function sendText(){
      var t=textInput.value.trim();
      if(!t && !pendingImage) return;
      sendUserMessage(t, pendingImage);
      textInput.value=''; pendingImage=null; attachThumb.removeAttribute('src'); attachPreview.hidden=true;
      inputField.classList.remove('has-image'); updateInputState();
    }
    btnSendText.addEventListener('pointerdown', (e)=>{ e.preventDefault(); sendText(); });

    (function(){
      var LOGIN_URL = 'portal-login.html';
      var REDIRECIONA = { 'Quero saber o status do meu pedido': true, 'Preciso de informações sobre estorno': true, 'Quero solicitar um cancelamento': true };
      function irParaLogin(){ try { (window.top || window).location.href = LOGIN_URL; } catch(err){ window.location.href = LOGIN_URL; } }
      var pillsWrap = document.getElementById('pillsChat');
      if(!pillsWrap) return;
      pillsWrap.addEventListener('click', function(e){
        var pill = e.target.closest('.pill-chat');
        if(!pill || !pillsWrap.contains(pill)) return;
        var texto = (pill.getAttribute('data-text') || '').trim();
        if(REDIRECIONA[texto]){ irParaLogin(); return; }
        if(texto) sendUserMessage(texto);
      });
    })();

    btnMic.addEventListener('pointerdown', (e)=>{ e.preventDefault(); inputField.classList.add('engaged','recording'); startChat(); });
    btnStop.addEventListener('pointerdown', (e)=>{ e.preventDefault(); inputField.classList.remove('recording'); textInput.value = AUDIO_TRANSCRICAO; updateInputState(); startChat(); textInput.focus({preventScroll:true}); });
    btnSend.addEventListener('pointerdown', (e)=>{ e.preventDefault(); inputField.classList.remove('recording'); sendUserMessage(AUDIO_TRANSCRICAO); });

    btnAdd.addEventListener('pointerdown', (e)=>{ e.preventDefault(); e.stopPropagation(); inputField.classList.add('engaged'); attachMenu.classList.toggle('open'); });
    document.addEventListener('pointerdown', (e)=>{ if(attachMenu.classList.contains('open') && !attachMenu.contains(e.target) && e.target!==btnAdd && !btnAdd.contains(e.target)) attachMenu.classList.remove('open'); });
    attachMenu.querySelectorAll('.attach-menu__item').forEach(item=>{
      item.addEventListener('pointerdown', (e)=>{ e.preventDefault(); e.stopPropagation(); attachMenu.classList.remove('open'); fileInput.click(); });
    });

    function processFile(f){
      if(!f) return;
      if(f.type.indexOf('image/')===0){
        const reader = new FileReader();
        reader.onload = ev=>{ pendingImage = ev.target.result; attachThumb.src = pendingImage; attachPreview.hidden = false; inputField.classList.add('has-image'); updateInputState(); startChat(); textInput.focus({preventScroll:true}); };
        reader.readAsDataURL(f);
      } else { textInput.value = '📎 '+f.name; updateInputState(); startChat(); textInput.focus({preventScroll:true}); }
    }
    fileInput.addEventListener('change', ()=>{ const f = fileInput.files && fileInput.files[0]; if(!f){ maybeResetWelcome(); return; } processFile(f); fileInput.value=''; });

    ['dragenter','dragover'].forEach(evt=>{ inputField.addEventListener(evt, (e)=>{ if(agent.classList.contains('processing')) return; e.preventDefault(); e.stopPropagation(); inputField.classList.add('dragover'); }); });
    ['dragleave','dragend'].forEach(evt=>{ inputField.addEventListener(evt, (e)=>{ e.preventDefault(); e.stopPropagation(); if(!inputField.contains(e.relatedTarget)) inputField.classList.remove('dragover'); }); });
    inputField.addEventListener('drop', (e)=>{
      e.preventDefault(); e.stopPropagation(); inputField.classList.remove('dragover');
      if(agent.classList.contains('processing')) return;
      inputField.classList.add('engaged');
      const dt = e.dataTransfer;
      if(dt && dt.files && dt.files.length){ processFile(dt.files[0]); }
      else if(dt){ const txt = dt.getData('text'); if(txt){ textInput.value += txt; updateInputState(); startChat(); textInput.focus({preventScroll:true}); } }
    });
    inputField.addEventListener('paste', (e)=>{
      if(agent.classList.contains('processing')) return;
      inputField.classList.add('engaged');
      const cd = e.clipboardData || window.clipboardData; if(!cd) return;
      if(cd.files && cd.files.length){ e.preventDefault(); processFile(cd.files[0]); return; }
      if(cd.items && cd.items.length){ for(const it of cd.items){ if(it.kind === 'file'){ const f = it.getAsFile(); if(f){ e.preventDefault(); processFile(f); return; } } } }
      setTimeout(()=>{ updateInputState(); if(textInput.value.trim()) startChat(); }, 0);
    });
    attachRemove.addEventListener('pointerdown', (e)=>{ e.preventDefault(); e.stopPropagation(); pendingImage = null; attachThumb.removeAttribute('src'); attachPreview.hidden = true; inputField.classList.remove('has-image','engaged'); updateInputState(); maybeResetWelcome(); });

    function scrollToBottom(){ chatScroll.scrollTop = chatScroll.scrollHeight; }
    function addMessage(html, who){ const el=document.createElement('div'); el.className='msg '+who; el.innerHTML=html; agentBody.appendChild(el); scrollToBottom(); return el; }
    function sendUserMessage(t, img){
      startChat();
      if(img){ addMessage(`<img class="sent-img" src="${img}" alt="Imagem enviada">`, 'user attachment'); }
      if(t){ addMessage(escapeHtml(t), 'user'); }
      updateInputState(); startProcessing(t, img);
    }
    function respostaComProduto(){
      return `Prontinho! Aqui estão as informações sobre o produto:<br><br>
        <strong>O que é?</strong><br>
        Este produto é o <strong>Aptamil Pepti</strong>, fabricado pela <strong>Danone</strong>.
        <div class="product-card">
          <img class="product-card__img js-zoom" src="${PRODUTO_IMG}" alt="Fórmula Infantil Aptamil Pepti 0-3 Anos 800g">
          <div class="product-card__info">
            <p class="product-card__name">Fórmula Infantil Aptamil Pepti 0-3 Anos 800g</p>
            <p class="product-card__price">R$ 301,99 <small>ou 6x de R$ 53,91 c/ juros</small></p>
          </div>
        </div>`;
    }
    function startProcessing(sol, img){
      agent.classList.add('processing');
      const b=addMessage(`<span class="dot-wave"><span></span><span></span><span></span></span> Trabalhando na melhor resposta.`,'typing');
      setTimeout(()=>{
        b.remove(); agent.classList.remove('processing');
        if(img){ addMessage(respostaComProduto(), 'bot'); }
        else { addMessage('Prontinho! Já localizei as informações da sua solicitação. 🙂','bot'); }
        textInput.focus({preventScroll:true});
      }, 2200);
    }

    agentBody.addEventListener('click', e=>{
      const t=e.target;
      if(t && t.tagName==='IMG' && (t.classList.contains('sent-img') || t.classList.contains('js-zoom'))){
        imgModalImg.src = t.src; imgModal.classList.add('open'); imgModal.setAttribute('aria-hidden','false');
      }
    });
    function closeImgModal(){ imgModal.classList.remove('open'); imgModal.setAttribute('aria-hidden','true'); }
    imgModalClose.addEventListener('click', closeImgModal);
    imgModalBackdrop.addEventListener('click', closeImgModal);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && imgModal.classList.contains('open')) closeImgModal(); });

    let feedbackTimer = null;
    function showFeedback(svg){ imgFeedbackImg.src = '../../assets/images/'+svg; imgFeedback.classList.add('show'); clearTimeout(feedbackTimer); feedbackTimer = setTimeout(()=> imgFeedback.classList.remove('show'), 1800); }
    imgSave.addEventListener('click', ()=>{ const a=document.createElement('a'); a.href=imgModalImg.src; a.download='imagem'; document.body.appendChild(a); a.click(); a.remove(); showFeedback('Feedback_Save.svg'); });
    imgCopy.addEventListener('click', async ()=>{ try{ const res=await fetch(imgModalImg.src); const blob=await res.blob(); await navigator.clipboard.write([new ClipboardItem({[blob.type]: blob})]); }catch(err){} showFeedback('Feedback_Copy.svg'); });

    function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
