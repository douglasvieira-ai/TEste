<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Cliente — Fale conosco</title>
  <style>
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    * { box-sizing: border-box; }
    :root{
      --azul: #007AFF; --azul-inst: #0a4bd1; --azul-claro: #EAF2FD;
      --cinza-bg: #EAF1FB; --texto: #1A1D1F; --texto-sec: #6B7280; --borda: #E6E9EF;
      --sidebar-w: 272px;
    }
    html, body { height: 100%; }
    body { margin: 0; font-family: "Inter","Segoe UI",system-ui,-apple-system,sans-serif; color: var(--texto); background: var(--cinza-bg); }

    .portal { display: flex; flex-direction: column; min-height: 100vh; }

    /* Header */
    .portal-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 20; }
    .portal-header__left { display: flex; align-items: center; gap: 20px; min-width: 0; }
    .brand-logo-link { text-decoration: none; cursor: pointer; display: inline-flex; }
    .brand-araujo { font-weight: 800; font-size: 26px; letter-spacing: 1px; color: #E5342E; line-height: 1; position: relative; padding-bottom: 5px; font-family: "Arial Black","Inter",sans-serif; }
    .brand-araujo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #054685; border-radius: 2px; }
    .header-divider { width: 1px; height: 30px; background: var(--borda); }
    .header-section-title { font-size: 17px; font-weight: 600; color: var(--texto); }
    .user-box { display: flex; align-items: center; gap: 14px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--azul); flex-shrink: 0; }
    .user-meta { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
    .user-name { font-size: 14px; font-weight: 700; color: var(--texto); }
    .user-email { font-size: 12px; color: var(--texto-sec); }
    .btn-logout { width: 40px; height: 40px; border: none; background: transparent; border-radius: 10px; cursor: pointer; color: var(--azul); display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .btn-logout:hover { background: var(--azul-claro); }

    .portal-body { display: flex; flex: 1 1 auto; min-height: 0; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: #fff; border-right: 1px solid var(--borda); padding: 16px 12px; overflow-y: auto; }
    .nav-section { margin-bottom: 20px; }
    .nav-section__title { font-size: 12px; font-weight: 600; letter-spacing: .3px; color: #9AA0A6; padding: 6px 12px; margin: 0 0 4px; }
    .nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer; color: var(--texto); font-size: 14px; text-decoration: none; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; transition: background .15s, color .15s; }
    .nav-item:hover { background: #F4F6FA; }
    .nav-item.active { background: var(--azul-claro); color: var(--azul); font-weight: 600; }
    .nav-item.active .nav-icon { color: var(--azul); }
    .nav-icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--texto-sec); display: flex; }
    .nav-icon svg { width: 100%; height: 100%; display: block; }
    .nav-label { flex: 1 1 auto; min-width: 0; }
    .nav-badge { width: 9px; height: 9px; padding: 0; border-radius: 50%; background: #E5342E; color: transparent; font-size: 0; display: flex; flex-shrink: 0; }

    /* ===== Main: card do agente (como no "Área do Cliente - Fale conosco.svg") ===== */
    .main { flex: 1 1 auto; padding: 24px; display: flex; min-width: 0; min-height: 0; }
    .agent-card { width: 100%; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(10,40,120,.08); display: flex; flex-direction: column; overflow: hidden; }
    .agent-card__header { display: flex; align-items: center; gap: 8px; padding: 18px 24px; flex-shrink: 0; border-bottom: 1px solid var(--borda); }
    .agent-card__brand--fallback { font-size: 17px; letter-spacing: .5px; display: inline-flex; align-items: center; gap: 7px; }
    .agent-card__brand--fallback .b-agente { font-weight: 500; color: #054685; }
    .agent-card__brand--fallback .b-sac { font-weight: 800; color: #0A2A5E; }
    .agent-card__brand--fallback .spark { width: 17px; height: 17px; display: inline-flex; color: #00C8FF; }
    .agent-card__brand--fallback .spark svg { width: 100%; height: 100%; display: block; }

    /* corpo rolável (welcome ou mensagens) */
    .agent-card__body { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; padding: 18px 24px; gap: 12px; }
    .agent-card.started .agent-card__body { justify-content: flex-start; }
    .welcome { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
    .agent-card.started .welcome { display: none; }
    .agent-greeting { font-size: 24px; font-weight: 700; color: var(--texto); margin: 0; }
    .agent-subtitle { font-size: 15px; color: var(--texto-sec); margin: 2px 0 10px; }

    .pills { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 760px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 1px solid #DDE2EC; border-radius: 999px; background: #fff; color: var(--texto); font-size: 15px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background .15s, border-color .15s; }
    .pill:hover { background: #f2f6ff; border-color: #a9c6ff; }
    .pill-icon { width: 18px; height: 18px; display: flex; color: var(--texto-sec); }
    .pill-icon svg { width: 100%; height: 100%; display: block; }

    /* Mensagens do chat */
    .messages { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; margin: 0 auto; }
    .msg { font-size: 15px; line-height: 1.5; }
    .msg.bot { align-self: stretch; max-width: 100%; color: #202124; }
    .msg.user { align-self: flex-end; max-width: 82%; background: #E6F2FF; color: #0a2a5e; padding: 9px 13px; border-radius: 14px; border-bottom-right-radius: 4px; }
    .msg.typing { align-self: flex-start; color: #5f6368; display: flex; align-items: center; gap: 8px; }
    .dot-wave { display: inline-flex; gap: 4px; }
    .dot-wave span { width: 6px; height: 6px; border-radius: 50%; background: #0059ff; animation: dotwave 1.2s ease-in-out infinite; }
    .dot-wave span:nth-child(2){ animation-delay:.15s } .dot-wave span:nth-child(3){ animation-delay:.3s }
    @keyframes dotwave { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-5px);opacity:1} }

    /* Card de login dentro do chat */
    .login-card { background: #F1F3F6; border-radius: 14px; padding: 18px; width: 100%; max-width: 420px; box-sizing: border-box; }
    .login-card__text { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: #202124; text-align: center; }
    .login-card__text strong { font-weight: 700; }
    .login-card__btn { width: 100%; height: 52px; border: none; border-radius: 10px; background: #0059ff; color: #fff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; transition: background .15s; }
    .login-card__btn:hover { background: #0049d6; }
    .login-card__btn svg { width: 22px; height: 22px; }

    /* ===== Rodapé: input funcional (borda animada, expansão, mic↔enviar) ===== */
    .agent-card__footer { padding: 16px 22px 26px; flex-shrink: 0; position: relative; }
    .input-field {
      position: relative; width: 70%; max-width: 720px; margin: 0 auto; min-height: 56px; border-radius: 28px; background: #fff;
      display: flex; align-items: center; padding: 6px 14px; gap: 10px; border: 1px solid #B2B2BC; box-sizing: border-box;
      transition: width .3s cubic-bezier(0.22,1,0.36,1), border-color .15s;
    }
    .input-field.engaged, .input-field:focus-within, .input-field.has-content, .input-field.recording { width: 100%; }
    .input-field::before {
      content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
      background: conic-gradient(from var(--angle), transparent 0deg, transparent 200deg, #007aff 280deg, #00e5ff 330deg, #fff 350deg, #00e5ff 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
      opacity: 0; transition: opacity .35s; animation: spin 3.2s linear infinite; pointer-events: none;
    }
    .input-field:focus-within::before, .input-field:hover::before, .input-field.recording::before { opacity: 1; }
    @keyframes spin { to { --angle: 360deg; } }
    .btn-round { flex-shrink: 0; width: 34px; height: 34px; border: none; background: transparent; color: var(--texto-sec); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background .15s; }
    .btn-round:hover { background: rgba(0,0,0,.05); }
    .btn-round svg { width: 22px; height: 22px; display: block; }
    .text-input { flex: 1 1 auto; border: none; outline: none; background: transparent; font-size: 15px; color: var(--texto); font-family: inherit; min-width: 0; caret-color: #007AFF; }
    .text-input::placeholder { color: #9aa0a6; }
    /* botão enviar: aparece no lugar do mic quando há conteúdo */
    .btn-send { flex-shrink:0; width:36px; height:36px; border:none; border-radius:50%; background:#1a73e8; cursor:pointer; display:none; align-items:center; justify-content:center; color:#fff; }
    .btn-send:hover { background:#1765cc; }
    .btn-send svg { width: 20px; height: 20px; }
    .input-field.has-content .btn-mic { display: none; }
    .input-field.has-content .btn-send { display: flex; }

    @media (max-width: 860px) {
      .sidebar { position: fixed; left: 0; top: 60px; bottom: 0; z-index: 30; transform: translateX(-100%); transition: transform .25s; box-shadow: 4px 0 24px rgba(0,0,0,.12); }
      .sidebar.open { transform: translateX(0); }
      .user-meta { display: none; }
      .main { padding: 0; }
      .agent-card { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="portal">
    <header class="portal-header">
      <div class="portal-header__left">
        <a class="brand-logo-link" href="../../index.html" target="_top" title="Voltar para a página inicial"><span class="brand-araujo">ARAUJO</span></a>
        <span class="header-divider" aria-hidden="true"></span>
        <span class="header-section-title">Fale conosco</span>
      </div>
      <div class="user-box">
        <span class="user-avatar" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="user-meta">
          <span class="user-name" id="userName">Keila</span>
          <span class="user-email" id="userEmail">keila.crm@araujo.com.br</span>
        </span>
        <button class="btn-logout" id="btnLogout" aria-label="Sair" title="Sair">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="portal-body">
      <nav class="sidebar" id="sidebar" aria-label="Navegação da Área do Cliente"></nav>

      <main class="main">
        <section class="agent-card" id="agentCard" aria-label="Agente SAC">
          <div class="agent-card__header">
            <span class="agent-card__brand--fallback"><span class="b-agente">AGENTE</span><span class="spark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2c.6 4.4 3 6.8 7.4 7.4C15 10 12.6 12.4 12 16.8 11.4 12.4 9 10 4.6 9.4 9 8.8 11.4 6.4 12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span class="b-sac">SAC</span></span>
          </div>

          <div class="agent-card__body" id="agentBody">
            <div class="welcome" id="welcome">
              <h1 class="agent-greeting">Olá, <span id="greetName">Douglas</span>!</h1>
              <p class="agent-subtitle">Em que posso te ajudar hoje?</p>
              <div class="pills" id="pills"></div>
            </div>
            <div class="messages" id="messages"></div>
          </div>

          <div class="agent-card__footer">
            <div class="input-field" id="inputField">
              <button class="btn-round btn-round--add" aria-label="Anexar" title="Anexar">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <input class="text-input" id="textInput" type="text" placeholder="Envie aqui a sua mensagem..." autocomplete="off">
              <button class="btn-round btn-mic" aria-label="Gravar áudio" title="Gravar áudio">
                <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </button>
              <button class="btn-send" id="btnSend" aria-label="Enviar mensagem" title="Enviar">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const USER_FALLBACK = { nome: 'Cliente', email: '', headerNome: 'Cliente' };
    const LOGIN_URL = 'portal-login.html';

    const ICON = {
      home:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1v-7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
      pedidos:'<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7 12 3l8.5 4-8.5 4-8.5-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.5 7v10l8.5 4 8.5-4V7M12 11v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      agenda:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      manip:'<svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v6l-4.5 8A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-3L14 9V3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      vacina:'<svg viewBox="0 0 24 24" fill="none"><path d="m14 4 6 6M17 7l-9 9-3 3 .5-3.5L14 7M9 11l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      chamados:'<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 8h6M9 12h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      comunic:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      balao:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      doc:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      box:'<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7 12 3l8.5 4-8.5 4-8.5-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.5 7v10l8.5 4 8.5-4V7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      estorno:'<svg viewBox="0 0 24 24" fill="none"><path d="M10 7 5 12l5 5M5 12h9a5 5 0 0 1 0 10h-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      duvida:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>',
      cancelar:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="m9 9 6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
    };

    const SIDEBAR = [
      { titulo:'Principal', itens:[
        { id:'inicio', label:'Início', icon:ICON.home, href:'portal-inicio.html' },
        { id:'pedidos', label:'Meus pedidos', icon:ICON.pedidos, badge:1, href:'portal-meus-pedidos.html' },
        { id:'agendamentos', label:'Meus agendamentos', icon:ICON.agenda, href:'#' },
        { id:'manipulados', label:'Meus manipulados', icon:ICON.manip, href:'#' },
        { id:'vacinas', label:'Minhas vacinas', icon:ICON.vacina, href:'#' }
      ]},
      { titulo:'Ajuda', itens:[
        { id:'chamados', label:'Meus chamados', icon:ICON.chamados, badge:1, href:'portal-meus-chamados.html' },
        { id:'comunicacoes', label:'Comunicações', icon:ICON.comunic, href:'#' },
        { id:'faleconosco', label:'Fale conosco', icon:ICON.balao, active:true, href:'portal-fale-conosco.html' }
      ]},
      { titulo:'Política e privacidade', itens:[
        { id:'privacidade', label:'Politica de Privacidade', icon:ICON.doc, href:'#' },
        { id:'termo', label:'Termo de uso', icon:ICON.doc, href:'#' },
        { id:'portal', label:'Portal da Privacidade', icon:ICON.doc, href:'#' }
      ]}
    ];

    // Pílulas: as que exigem login têm requireAuth:true e enviam um texto (data-text) ao chat.
    const PILLS = [
      { id:'status', label:'Status do pedido', icon:ICON.box, text:'Quero saber o status do meu pedido', requireAuth:true },
      { id:'estorno', label:'Estorno', icon:ICON.estorno, text:'Preciso de informações sobre estorno', requireAuth:true },
      { id:'duvidas', label:'Dúvidas', icon:ICON.duvida, text:'Tenho uma dúvida', requireAuth:false },
      { id:'cancelamento', label:'Cancelamento', icon:ICON.cancelar, text:'Quero solicitar um cancelamento', requireAuth:true }
    ];

    // ===== Autenticação =====
    function getAuth(){ try { return JSON.parse(localStorage.getItem('araujoAuth') || 'null'); } catch(e){ return null; } }
    function clienteAutenticado(){ var a = getAuth(); return !!(a && a.logado); }
    function primeiroNome(){ var a = getAuth(); if(!a || !a.nome) return ''; var n = String(a.nome).trim().split(/\s+/)[0] || ''; return n ? n.charAt(0).toUpperCase() + n.slice(1) : ''; }

    // ===== Render sidebar =====
    function renderSidebar(){
      document.getElementById('sidebar').innerHTML = SIDEBAR.map(sec => `
        <div class="nav-section"><p class="nav-section__title">${sec.titulo}</p>
          <ul class="nav-list">${sec.itens.map(it => {
            const inner = `<span class="nav-icon">${it.icon}</span><span class="nav-label">${it.label}</span>${it.badge?'<span class="nav-badge"></span>':''}`;
            return (it.href && it.href!=='#')
              ? `<li><a class="nav-item${it.active?' active':''}" href="${it.href}">${inner}</a></li>`
              : `<li><button class="nav-item${it.active?' active':''}" type="button">${inner}</button></li>`;
          }).join('')}</ul>
        </div>`).join('');
    }
    function renderPills(){
      document.getElementById('pills').innerHTML = PILLS.map(p => `
        <button class="pill" data-id="${p.id}" type="button"><span class="pill-icon">${p.icon}</span>${p.label}</button>`).join('');
    }
    function atualizarSaudacao(){
      var g = document.getElementById('greetName');
      var h = document.querySelector('.agent-greeting');
      var sub = document.querySelector('.agent-subtitle');
      if (clienteAutenticado()) {
        var nome = primeiroNome();
        if (h) h.innerHTML = nome ? ('Olá, <span id="greetName">'+nome+'</span>!') : 'Olá!';
      } else {
        if (h) h.textContent = 'Olá';
      }
      if (sub) sub.style.display = '';
    }

    // ===== Chat =====
    const agentCard = document.getElementById('agentCard');
    const messages = document.getElementById('messages');
    const agentBody = document.getElementById('agentBody');
    const inputField = document.getElementById('inputField');
    const textInput = document.getElementById('textInput');
    const btnSend = document.getElementById('btnSend');
    let processando = false;

    function startChat(){ agentCard.classList.add('started'); }
    function scrollBottom(){ agentBody.scrollTop = agentBody.scrollHeight; }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function addMessage(html, who){ const el=document.createElement('div'); el.className='msg '+who; el.innerHTML=html; messages.appendChild(el); scrollBottom(); return el; }
    function updateInputState(){ inputField.classList.toggle('has-content', textInput.value.trim().length>0); }

    function cardLoginHTML(){
      return `<div class="login-card">
        <p class="login-card__text">Para que eu possa continuar te ajudando, <strong>é necessário que você entre ou crie uma conta</strong></p>
        <a class="login-card__btn" id="btnEntrarAgente" href="${LOGIN_URL}" target="_top" role="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Entrar
        </a>
      </div>`;
    }
    function irParaLogin(){ try { (window.top||window).location.href = LOGIN_URL; } catch(e){ window.location.href = LOGIN_URL; } }

    function mostrarCardLogin(){
      startChat();
      addMessage(cardLoginHTML(), 'bot');
      var btn = document.getElementById('btnEntrarAgente');
      if (btn) btn.addEventListener('click', function(ev){ ev.preventDefault(); irParaLogin(); });
    }
    function processarResposta(){
      processando = true;
      const b = addMessage('<span class="dot-wave"><span></span><span></span><span></span></span> Trabalhando na melhor resposta.', 'typing');
      setTimeout(()=>{ b.remove(); addMessage('Prontinho! Já localizei as informações da sua solicitação. 🙂','bot'); processando = false; scrollBottom(); }, 2000);
    }
    // Envia texto digitado pelo usuário (sempre aparece no chat)
    function enviarMensagem(texto){
      texto = (texto || '').trim();
      if (!texto) return;
      startChat();
      addMessage(escapeHtml(texto), 'user');
      textInput.value=''; updateInputState();
      processarResposta();
    }

    // ===== Interações =====
    function init(){
      renderSidebar();
      renderPills();
      atualizarSaudacao();

      document.getElementById('sidebar').addEventListener('click', (e)=>{
        const btn = e.target.closest('button.nav-item');
        if(!btn) return;
      });

      // Pílulas: aparecem DIRETAMENTE no chat; se exigem login e deslogado, mostra card de login.
      document.getElementById('pills').addEventListener('click', (e)=>{
        const pill = e.target.closest('.pill');
        if(!pill) return;
        const dados = PILLS.find(p => p.id === pill.dataset.id);
        if(!dados) return;
        if (dados.requireAuth && !clienteAutenticado()) {
          startChat();
          addMessage(escapeHtml(dados.text), 'user');   // eco da solicitação (sem processamento)
          mostrarCardLogin();                            // card de login direto
          return;
        }
        enviarMensagem(dados.text);                      // fluxo normal: mensagem no chat
      });

      // Input: expande ao focar/digitar, mostra enviar quando há conteúdo
      inputField.addEventListener('pointerdown', ()=> inputField.classList.add('engaged'), true);
      inputField.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(!inputField.contains(document.activeElement) && !textInput.value.trim()) inputField.classList.remove('engaged'); },0); });
      textInput.addEventListener('input', updateInputState);
      textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && textInput.value.trim()) enviarMensagem(textInput.value); });
      btnSend.addEventListener('pointerdown', (e)=>{ e.preventDefault(); enviarMensagem(textInput.value); });

      document.getElementById('btnLogout').addEventListener('click', ()=> alert('Sair / Logout'));
    }
    init();
  </script>
</body>
</html>
