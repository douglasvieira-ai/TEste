  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente IA / SAC — Chat</title>
  <style>
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100vh;
      background: #f0f2f5;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ======= FUNDO: página da Araujo embutida ======= */
    .site-background {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; z-index: 0; background: #fff;
    }
    .page-hint {
      position: fixed; top: 24px; left: 32px; color: #5f6368; font-size: 13px;
      background: rgba(255,255,255,.85); padding: 6px 12px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08); z-index: 9996;
    }

    /* ======= BALÃO FLUTUANTE (gatilho) ======= */
    .widget-interaction-area {
      position: fixed; bottom: 40px; right: 40px; height: 50px; width: 50px;
      transition: width 0.4s cubic-bezier(0.25,1,0.5,1);
      z-index: 9999; display: flex; justify-content: flex-end; align-items: center;
    }
    .widget-interaction-area:hover { width: 172px; }
    .widget-interaction-area.hidden { opacity: 0; pointer-events: none; transform: scale(0.6); transition: opacity .25s, transform .25s; }
    .trigger-button {
      position: absolute; right: 0; width: 50.4px; height: 50.4px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: transform .4s cubic-bezier(0.25,1,0.5,1), opacity .3s; z-index: 10;
    }
    .trigger-button svg { width: auto; height: 100%; filter: drop-shadow(0 4px 6px rgba(0,89,255,.2)); }
    .widget-interaction-area:hover .trigger-button { transform: scale(.5) rotate(-15deg); opacity: 0; pointer-events: none; }
    .fale-conosco-wrapper {
      position: absolute; right: 0; width: 172px; height: 50px;
      clip-path: inset(-20px -20px -20px 100%); transition: clip-path .4s cubic-bezier(0.25,1,0.5,1), opacity .3s; opacity: 0; z-index: 5;
    }
    .widget-interaction-area:hover .fale-conosco-wrapper { clip-path: inset(-20px -20px -20px -20px); opacity: 1; }
    .balloon-box { position: relative; width: 172px; height: 50.4px; border-radius: 12px; cursor: pointer; filter: drop-shadow(0 4px 4px rgba(0,217,255,.35)); }
    .balloon-vector { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .balloon-content { position: absolute; top: 0; left: 0; width: 94.7%; height: 83.6%; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 2; pointer-events: none; }
    .balloon-icon { width: 18px; height: 18px; display: block; }
    .balloon-label { color: #fff; font-size: 16px; font-weight: 600; letter-spacing: .5px; }
    .glow-runner { animation: moveBeam 5s linear infinite; }
    @keyframes moveBeam {
      0%{transform:translate(.5px,20px)}12.1%{transform:translate(20.07px,.66px)}24.2%{transform:translate(61.9px,.3px)}
      36.4%{transform:translate(107.91px,.45px)}45.5%{transform:translate(130.91px,2.21px)}54.5%{transform:translate(132.58px,25.69px)}
      63.6%{transform:translate(126.31px,32.41px)}75.8%{transform:translate(83.65px,32.06px)}87.9%{transform:translate(20.07px,31.7px)}100%{transform:translate(.42px,16.17px)}
    }

    /* ======= OVERLAY (escurece o fundo no modo expandido) ======= */
    .agent-overlay { position: fixed; inset: 0; background: rgba(10,25,60,.35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9997; }
    .agent-overlay.show { opacity: 1; pointer-events: auto; }

    /* =========================================================
       COMPONENTE DE CHAT REAL (HTML/CSS) — substitui Chatopen.svg
       ========================================================= */
    .agent {
      position: fixed; bottom: 30px; right: 30px;
      width: 420px; height: calc(100vh - 100px); max-height: 860px;
      z-index: 9998;
      display: flex; flex-direction: column;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-sizing: border-box;
      transform: translateY(20px) scale(.96); opacity: 0; pointer-events: none;
      transform-origin: bottom right;
      transition: transform .4s cubic-bezier(0.22,1,0.36,1), opacity .3s,
                  width .4s cubic-bezier(0.22,1,0.36,1), height .4s cubic-bezier(0.22,1,0.36,1),
                  bottom .4s, right .4s, top .4s, left .4s;
      box-shadow: 0 18px 50px rgba(0,40,120,.28);
    }
    .agent.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }

    /* Estado expandido (modo "Full") */
    .agent.expanded {
      top: 50%; left: 50%; right: auto; bottom: auto;
      width: min(960px, 82vw); height: min(840px, calc(100vh - 48px));
      transform: translate(-50%,-50%) scale(1); transform-origin: center;
    }

    /* ===== MOBILE (sheet page): chat ocupa 100% da largura e 90% da altura ===== */
    @media (max-width: 768px) {
      /* overlay no mobile (sheet): blur sutil, preto 30% (controlado por .show via JS) */
      .agent-overlay {
        background: rgba(0,0,0,.30);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
      }

      .agent, .agent.expanded {
        top: auto; left: 0; right: 0; bottom: 0;
        width: 100%; height: 90%; max-height: 90%;
        display: flex; flex-direction: column;
        border-radius: 16px 16px 0 0;   /* cantos superiores arredondados (sheet) */
        transform: translateY(100%);     /* entra de baixo */
        transform-origin: bottom center;
      }
      .agent.open, .agent.expanded.open {
        transform: translateY(0);
      }
      /* alça do sheet no topo */
      .agent::before {
        content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
        width: 40px; height: 4px; border-radius: 2px; background: #d0d3d9; z-index: 5;
      }
      /* mobile: header com a logo centralizada e SEM os botões de expandir/fechar */
      .chat-header { padding-top: 22px; justify-content: center; position: relative; }
      .chat-header__actions { display: none !important; }
      .chat-header__brand { margin: 0 auto !important; }
    }

    /* ---- Cabeçalho ---- */
    .chat-header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid #eef0f3;
    }
    .chat-header__brand { display: flex; align-items: center; }
    .chat-header__brand img { display: block; height: 16px; max-height: 16px; width: auto; }
    .chat-header__actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .chat-iconbtn {
      width: 30px; height: 30px; border: none; background: transparent; color: #5f6368;
      border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .chat-iconbtn:hover { background: rgba(0,0,0,.06); color: #202124; }
    .chat-iconbtn img { display: block; }
    /* alterna icone expandir/recolher conforme o estado (so um visivel por vez) */
    .chat-iconbtn .icon-collapse { display: none; }
    .agent.expanded .chat-iconbtn .icon-expand { display: none; }
    .agent.expanded .chat-iconbtn .icon-collapse { display: block; }
    .pill-icon { display: block; flex-shrink: 0; }

    /* ---- Corpo rolável (saudação + mensagens + pílulas) ---- */
    .chat-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 18px 16px;                 /* drawer: 16px nas laterais */
      display: flex; flex-direction: column; gap: 12px;
    }
    .agent.expanded .chat-scroll { padding: 18px 80px; }  /* expandido: 80px nas laterais */
    /* Tela de boas-vindas centralizada no chat (horizontal e verticalmente) */
    .welcome {
      flex: 1 1 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center;
    }
    /* Ao iniciar conversa / interagir, a tela de boas-vindas some imediatamente */
    .agent.started .welcome { display: none; }
    .chat-greeting { text-align: center; color: #202124; margin: 6px 0 2px; }
    .chat-greeting h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .chat-greeting p  { margin: 4px 0 0; font-size: 14px; color: #5f6368; }

    /* Card de login dentro do chat (exibido quando pill exige autenticação e cliente deslogado) */
    .login-card { background: #F1F3F6; border-radius: 14px; padding: 18px 18px 20px; width: 100%; max-width: 420px; margin: 0 auto; box-sizing: border-box; }
    .login-card__text { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: #202124; text-align: center; }
    .login-card__text strong { font-weight: 700; }
    .login-card__btn { width: 100%; height: 54px; border: none; border-radius: 10px; background: #0059ff; color: #fff; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; transition: background .15s; }
    .login-card__btn:hover { background: #0049d6; }
    .login-card__btn svg { width: 22px; height: 22px; }

    /* Pílulas de atalho (reais, clicáveis): bloco centralizado no componente,
       com as pills justificadas à esquerda (2ª linha alinha à esquerda). */
    .pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; width: fit-content; max-width: 100%; margin: 4px auto 2px; }
    .pill {
      border: 1px solid #d9dde3; background: #fff; color: #0a2a5e;
      border-radius: 18px; padding: 6px 12px; /* (9) 6px top/bottom, 12px laterais */ font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
      transition: background .15s, border-color .15s;
    }
    .pill:hover { background: #f2f6ff; border-color: #a9c6ff; }
    /* maximizado: mantem o bloco centralizado e as pills justificadas a esquerda */
    .agent.expanded .pills { justify-content: flex-start; }

    .messages { display: flex; flex-direction: column; gap: 10px; }
    .msg { font-size: 14px; line-height: 1.5; }
    /* Agente: texto livre, sem balão, alinhado à esquerda e ocupando a largura */
    .msg.bot  { align-self: stretch; max-width: 100%; color: #202124; background: none; border: none; padding: 0; }
    /* Usuário: balão azul claro, à direita */
    .msg.user { align-self: flex-end; max-width: 82%; background: #E6F2FF; color: #0a2a5e; padding: 9px 13px; border-radius: 14px; border-bottom-right-radius: 4px; }
    .msg.typing { align-self: flex-start; color: #5f6368; background: none; border: none; padding: 0; display: flex; align-items: center; gap: 8px; }
    .dot-wave { display: inline-flex; gap: 4px; }
    .dot-wave span { width: 6px; height: 6px; border-radius: 50%; background: #0059ff; animation: dotwave 1.2s ease-in-out infinite; }
    .dot-wave span:nth-child(2){ animation-delay:.15s } .dot-wave span:nth-child(3){ animation-delay:.3s }
    @keyframes dotwave { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-5px);opacity:1} }

    /* ---- Rodapé: input funcional ---- */
    .chat-input-container {
      flex-shrink: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 16px 16px 24px;            /* drawer: 16px nas laterais */
      background: #fff;
    }
    .agent.expanded .chat-input-container { padding: 16px 80px 24px; }  /* expandido: 80px nas laterais */
    .input-field {
      position: relative; width: 70%; margin: 0 auto; min-height: 48px; border-radius: 24px; background: #fff;
      display: flex; align-items: center; padding: 4px 8px; gap: 6px; border: 1px solid #B2B2BC;
      box-sizing: border-box;
      transition: width .3s cubic-bezier(0.22,1,0.36,1), border-color .15s, background-color .15s;
    }
    /* O input fica recolhido (70%). O HOVER so aciona a animacao de gradiente (nao expande).
       A expansao para 100% ocorre quando uma ACAO se inicia: .engaged (pointerdown em um
       botao/campo), foco/digitar, gravar audio, anexo pendente, conteudo ou drag&drop.
       Usar .engaged no pointerdown garante que o layout ja esteja em 100% ANTES do ciclo
       do click, evitando o cancelamento do 1o clique por layout shift. */
    .input-field.engaged,
    .input-field:focus-within,
    .input-field.has-content,
    .input-field.recording,
    .input-field.has-image,
    .input-field.dragover { width: 100%; }
    .agent.expanded .input-field { min-height: 56px; }

    .input-field::before {
      content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
      background: conic-gradient(from var(--angle), transparent 0deg, transparent 200deg, #007aff 280deg, #00e5ff 330deg, #fff 350deg, #00e5ff 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
      opacity: 0; transition: opacity .35s; animation: spin 3.2s linear infinite; pointer-events: none;
    }
    .input-field::after { content:""; position:absolute; inset:-4px; border-radius:inherit; box-shadow:0 0 4px 0 rgba(0,200,255,.08); opacity:0; transition:opacity .35s; pointer-events:none; }
    .input-field:focus-within::before, .input-field:hover::before, .input-field.recording::before { opacity: 1; }
    .input-field:focus-within::after, .input-field:hover::after, .input-field.recording::after { opacity: 1; }
    /* a borda base (#B2B2BC) permanece visivel onde o gradiente ainda nao passou */
    @keyframes spin { to { --angle: 360deg; } }

    .btn-add { flex-shrink:0; width:28px; height:28px; border:none; background:transparent; color:#5f6368; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .btn-add:hover { background: rgba(0,0,0,.05); }
    .text-input { flex:1; border:none; outline:none; background:transparent; font-size:14px; color:#202124; font-family:inherit; min-width:0; }
    .text-input::placeholder { color:#9aa0a6; }
    .btn-mic { flex-shrink:0; width:30px; height:30px; border:none; background:transparent; cursor:pointer; color:#5f6368; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .btn-mic:hover { background: rgba(0,0,0,.05); color:#000; }

    .waveform { flex:1; height:30px; display:flex; align-items:center; justify-content:center; gap:3px; overflow:hidden; min-width:0; }
    .waveform .bar { width:3px; min-height:3px; border-radius:3px; background:#1a73e8; animation: wave 1.1s ease-in-out infinite; }
    @keyframes wave { 0%,100%{height:4px;opacity:.55} 50%{height:20px;opacity:1} }
    .btn-stop { flex-shrink:0; width:32px; height:32px; border:1.5px solid #cfcfd4; background:#fff; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .btn-stop .square { width:10px; height:10px; border-radius:2px; background:#3c4043; }
    .btn-send { flex-shrink:0; width:34px; height:34px; border:none; border-radius:50%; background:#1a73e8; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; }
    .btn-send:hover { background:#1765cc; }

    /* botao enviar texto (coexiste no lugar do mic quando ha conteudo) */
    .btn-send-text { flex-shrink:0; width:34px; height:34px; border:none; border-radius:50%; background:#1a73e8; cursor:pointer; display:none; align-items:center; justify-content:center; }
    .btn-send-text:hover { background:#1765cc; }
    /* com conteudo no input: esconde o mic, mostra o enviar */
    .input-field.has-content .btn-mic { display:none; }
    .input-field.has-content .btn-send-text { display:flex; }

    .btn-add img, .btn-mic img, .btn-send img, .btn-send-text img { display:block; }

    .state-typing { display:flex; align-items:center; gap:6px; width:100%; }
    .state-recording { display:none; align-items:center; gap:6px; width:100%; }
    .input-field.recording .state-typing { display:none; }
    .input-field.recording .state-recording { display:flex; }

    /* bloqueio durante processamento */
    .agent.processing .pill { pointer-events:none; opacity:.6; }
    .agent.processing .input-field { pointer-events:none; }
    .agent.processing .input-field::before, .agent.processing .input-field::after { opacity:0 !important; }

    /* ===== (3) Menu de anexo (Câmera / Galeria / Arquivos) ===== */
    .chat-input-container { position: relative; }
    .attach-menu {
      position: absolute;
      left: 16px; bottom: calc(100% - 8px);
      min-width: 220px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(45,50,54,.18);
      padding: 8px;
      display: flex; flex-direction: column; gap: 2px;
      transform-origin: bottom left;
      opacity: 0; visibility: hidden; transform: translateY(8px) scale(.98);
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
      z-index: 20;
    }
    .agent.expanded .attach-menu { left: 80px; }
    .attach-menu.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .attach-menu__item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px; border: none; background: transparent;
      font-family: inherit; font-size: 16px; color: #202124; cursor: pointer;
      border-radius: 10px; text-align: left;
    }
    .attach-menu__item:hover { background: #f2f6ff; }
    .attach-menu__item img { display: block; }

    /* ===== (4) Preview da imagem anexada no input ===== */
    .attach-preview { position: relative; flex-shrink: 0; width: 56px; height: 56px; }
    .attach-preview__thumb {
      width: 56px; height: 56px; object-fit: cover; border-radius: 10px; display: block;
      border: 1px solid #e3e3e6;
    }
    .attach-preview__remove {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px; border: none; background: transparent; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .attach-preview__remove img { display: block; width: 20px; height: 20px; }

    /* (14/19) com imagem anexada: preview na linha de cima; "+", texto, mic e enviar na linha de baixo; cantos 24px */
    .input-field.has-image { border-radius: 24px; }
    .input-field.has-image .state-typing { flex-wrap: wrap; align-items: center; }
    .input-field.has-image .attach-preview { order: 0; flex: 0 0 100%; width: auto; height: 72px; margin: 6px 0 8px 2px; }
    .input-field.has-image .attach-preview__thumb { width: 72px; height: 72px; }
    /* o "x" fica no canto superior direito DO THUMB (72px), nao da linha inteira */
    .input-field.has-image .attach-preview__remove { left: 46px; right: auto; top: 4px; }
    .input-field.has-image .btn-add { order: 1; display: flex; }
    .input-field.has-image .text-input { order: 2; }
    .input-field.has-image .btn-mic { order: 3; }
    .input-field.has-image .btn-send-text { order: 4; }
    /* com imagem anexada, o microfone E o enviar aparecem juntos na linha de baixo (sempre) */
    .input-field.has-image .btn-mic { display: flex !important; }
    .input-field.has-image .btn-send-text { display: flex !important; }

    /* ===== Drag & drop de anexos no input ===== */
    .input-field.dragover { border-color: #0059ff; border-style: dashed; background: #f2f8ff; }
    .input-field.dragover::before, .input-field.dragover::after { opacity: 0 !important; }
    .drop-hint {
      position: absolute; inset: 0; border-radius: inherit;
      display: none; align-items: center; justify-content: center;
      gap: 8px; font-size: 13px; font-weight: 600; color: #0059ff;
      background: rgba(242,248,255,.96); border: 2px dashed #0059ff; border-radius: inherit;
      pointer-events: none; z-index: 5;
    }
    .input-field.dragover .drop-hint { display: flex; }

    /* ===== (5) Resposta com card de produto (imagem) ===== */
    /* Containers de conteúdo do bot ocupam toda a largura do chat,
       respeitando os paddings/gaps existentes (o pai .msg.bot tem padding:0 e max-width:100%). */
    .product-card, .bot-block {
      margin-top: 8px;
      border: 1px solid #eef0f3; border-radius: 12px; overflow: hidden;
      width: 100%; max-width: 100%; box-sizing: border-box; background: #fff;
    }
    /* No modo "Full" (chat expandido) o product-card tem largura máxima de 520px
       e fica SEMPRE centralizado no chat (margens laterais automáticas). */
    .agent.expanded .product-card {
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
    .product-card__img {
      width: 100%; height: 160px; object-fit: contain; background: #fff; display: block; cursor: zoom-in;
      padding: 10px;
    }
    .product-card__info { padding: 10px 12px 12px; }
    .product-card__name { font-size: 13px; color: #202124; margin: 0 0 4px; line-height: 1.35; }
    .product-card__price { font-size: 13px; color: #0a2a5e; font-weight: 600; margin: 0; }
    .product-card__price small { display:block; font-weight:400; color:#5f6368; font-size:12px; }
    /* (20) anexo enviado: preview quadrada limitada, SEM balão, separado do texto */
    .msg.attachment { background: none; border: none; padding: 0; max-width: none; }
    .msg.attachment .sent-img {
      width: 120px; height: 120px; object-fit: cover;
      border-radius: 14px; display: block; cursor: zoom-in;
      border: 1px solid #eef0f3;
    }

    /* ===== (18) Modal de imagem expandida: sobrepõe TODO o conteúdo (inclusive o chat) ===== */
    .img-modal { position: fixed; inset: 0; z-index: 2147483000; display: none; }
    .img-modal.open { display: block; }
    .img-modal__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.88); }

    /* imagem centralizada, ocupando a área com 16px de respiro das extremidades */
    .img-modal__img {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      max-width: calc(100vw - 32px); max-height: calc(100vh - 32px);
      object-fit: contain; border-radius: 12px; z-index: 1;
    }

    /* botão fechar: canto superior esquerdo, 16px das extremidades */
    .img-modal__close {
      position: absolute; top: 16px; left: 16px; z-index: 2;
      border: none; background: transparent; padding: 0; cursor: pointer; line-height: 0;
    }
    .img-modal__close img { display: block; }

    /* ações (Copiar / Salvar): centralizadas no rodapé, 16px do bottom, 16px entre elas */
    .img-modal__actions {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 2; display: flex; gap: 16px;
    }

  <script>
    const widget=document.getElementById('widget'), balloonBox=document.getElementById('balloonBox');
    const agent=document.getElementById('agent'), overlay=document.getElementById('agentOverlay');
    const btnExpand=document.getElementById('btnExpand'), btnClose=document.getElementById('btnClose');
    const inputField=document.getElementById('inputField'), textInput=document.getElementById('textInput');
    const btnMic=document.getElementById('btnMic'), btnStop=document.getElementById('btnStop'), btnSend=document.getElementById('btnSend');
    const btnSendText=document.getElementById('btnSendText');
    const btnAdd=document.getElementById('btnAdd'), fileInput=document.getElementById('fileInput');
    const attachMenu=document.getElementById('attachMenu');
    const attachPreview=document.getElementById('attachPreview'), attachThumb=document.getElementById('attachThumb'), attachRemove=document.getElementById('attachRemove');
    const imgModal=document.getElementById('imgModal'), imgModalImg=document.getElementById('imgModalImg');
    const imgModalClose=document.getElementById('imgModalClose'), imgModalBackdrop=document.getElementById('imgModalBackdrop');
    const imgSave=document.getElementById('imgSave'), imgCopy=document.getElementById('imgCopy');
    const imgFeedback=document.getElementById('imgFeedback'), imgFeedbackImg=document.getElementById('imgFeedbackImg');

    // guarda o anexo pendente (dataURL) para enviar junto com a mensagem
    let pendingImage = null;

    // texto que o agente "transcreve" a partir do audio gravado
    const AUDIO_TRANSCRICAO = 'Quero saber o status do meu pedido';
    // imagem de exemplo do produto que o agente devolve (placeholder que sempre renderiza)
    const PRODUTO_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
         <rect width="300" height="300" fill="#f3f4f7"/>
         <rect x="90" y="70" width="120" height="170" rx="10" fill="#dfe6f3"/>
         <text x="150" y="160" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#0a2a5e" text-anchor="middle">Aptamil</text>
         <text x="150" y="186" font-family="Inter,Arial" font-size="16" fill="#5f6368" text-anchor="middle">Pepti</text>
       </svg>`);
    const waveform=document.getElementById('waveform'), agentBody=document.getElementById('agentBody');
    const chatScroll=document.getElementById('chatScroll');

    // barras da onda (gravação de áudio)
    for (let i=0;i<26;i++){ const b=document.createElement('span'); b.className='bar'; b.style.animationDelay=`-${(i*0.055).toFixed(3)}s`; b.style.animationDuration=`${(0.9+(i%5)*0.08).toFixed(2)}s`; waveform.appendChild(b); }

    const isMobile = ()=> window.matchMedia('(max-width: 768px)').matches;

    // Lê o estado de autenticação salvo pelo login (localStorage 'araujoAuth').
    function getAuth(){
      try { return JSON.parse(localStorage.getItem('araujoAuth') || 'null'); }
      catch (e) { return null; }
    }
    function clienteAutenticado(){ var a = getAuth(); return !!(a && a.logado); }
    // Primeiro nome capitalizado (ex.: 'douglas' -> 'Douglas').
    function primeiroNome(){
      var a = getAuth();
      if (!a || !a.nome) return '';
      var n = String(a.nome).trim().split(/\s+/)[0] || '';
      return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
    }
    // Atualiza a saudação: logado -> "Olá, Douglas!" + subtítulo; deslogado -> apenas "Olá".
    function atualizarSaudacao(){
      var titulo = document.getElementById('chatGreetTitle');
      var sub = document.getElementById('chatGreetSub');
      if (!titulo) return;
      if (clienteAutenticado()) {
        var nome = primeiroNome();
        titulo.textContent = nome ? ('Olá, ' + nome + '!') : 'Olá!';
        if (sub) sub.style.display = '';
      } else {
        titulo.textContent = 'Olá';
        if (sub) sub.style.display = '';
      }
    }

    function openAgent(){
      atualizarSaudacao();
      agent.classList.add('open'); agent.setAttribute('aria-hidden','false'); widget.classList.add('hidden');
      if(isMobile()) overlay.classList.add('show');
      setTimeout(()=>textInput.focus({preventScroll:true}),350);
    }
    balloonBox.addEventListener('click', openAgent);

    // Abre o agente quando uma pagina embarcada (iframe) solicita via postMessage.
    window.addEventListener('message', (event)=>{
      const data = event && event.data;
      if (data === 'abrir-agente' || (data && data.tipo === 'abrir-agente')) openAgent();
    });

    // Abre o agente automaticamente quando a pagina e carregada com ?agent=open (ou #agent).
    // Usado por paginas do portal (ex.: "Fale Conosco" em Meus pedidos) que rodam como topo.
    (function(){
      var querAbrir = /(?:[?&]agent=open)/.test(location.search) || location.hash === '#agent';
      if (querAbrir) setTimeout(openAgent, 60);
    })();

    function closeAgent(){ agent.classList.remove('open','expanded','processing','started'); agent.setAttribute('aria-hidden','true'); overlay.classList.remove('show'); inputField.classList.remove('recording','has-content','engaged'); widget.classList.remove('hidden'); agentBody.innerHTML=''; textInput.value=''; attachMenu.classList.remove('open'); pendingImage=null; attachPreview.hidden=true; attachThumb.removeAttribute('src'); inputField.classList.remove('has-image'); }
    btnClose.addEventListener('click', closeAgent);

    // ===== (Click Outside) fecha a drawer REDUZIDA ao clicar fora dela =====
    // Listener GLOBAL e PERMANENTE no document (nao depende de overlay/backdrop, que nao
    // existe no modo lateral reduzido). Usa pointerdown (captura antes de cancelamentos de
    // links/botoes da pagina) e reutiliza a logica do #btnClose.
    document.addEventListener('pointerdown', (event)=>{
      // 1. so quando a drawer esta aberta
      if(!agent.classList.contains('open')) return;
      // 2. no modo maximizado/expandido (modal central) NAO fecha ao clicar fora
      if(agent.classList.contains('expanded')) return;
      // 3. no mobile o overlay ja trata o fechamento
      if(isMobile()) return;
      // 4. clique DENTRO de qualquer regiao da drawer -> nao fecha
      var dentroDrawer = event.target.closest('.chat-header, .chat-scroll, .chat-input-container, .agent');
      // 5. clique no gatilho flutuante (abre a drawer) ou no modal de imagem -> nao fecha
      var noLauncher = event.target.closest('#widget, #balloonBox');
      var noImgModal = event.target.closest('#imgModal');
      if(!dentroDrawer && !noLauncher && !noImgModal){
        btnClose.click();                                     // reutiliza a transicao/logica existente
      }
    });

    // ===== Click dentro do IFRAME de fundo (pagina Araujo) =====
    // Eventos de pointer dentro de um <iframe> NAO propagam para o document pai, entao
    // cliques em areas em branco do site de fundo nao disparavam o click-outside acima.
    // Detectamos via blur da window: ao clicar no iframe, ele vira o activeElement e a
    // window perde o foco -> se a drawer estiver aberta/reduzida, fechamos.
    var siteFrame = document.querySelector('.site-background');
    window.addEventListener('blur', ()=>{
      setTimeout(()=>{
        if(!agent.classList.contains('open')) return;
        if(agent.classList.contains('expanded')) return;
        if(isMobile()) return;
        if(document.activeElement === siteFrame){
          btnClose.click();
        }
      }, 0);
    });

    // marca o inicio da conversa / interacao -> some a tela de boas-vindas
    function startChat(){ agent.classList.add('started'); }
    // alterna o icone de microfone <-> enviar: mostra "enviar" quando ha texto OU imagem pendente
    function updateInputState(){
      inputField.classList.toggle('has-content', textInput.value.trim().length > 0 || !!pendingImage);
    }
    // volta a saudacao se a interacao foi cancelada e nao ha conversa iniciada
    function maybeResetWelcome(){
      var temConversa = agentBody.children.length > 0;
      var gravando = inputField.classList.contains('recording');
      var temTexto = textInput.value.trim().length > 0;
      if (!temConversa && !gravando && !temTexto) {
        agent.classList.remove('started');
      }
    }

    // expandir <-> reduzir
    btnExpand.addEventListener('click', ()=>{ agent.classList.toggle('expanded'); overlay.classList.toggle('show', agent.classList.contains('expanded')); });
    overlay.addEventListener('click', ()=>{ if(isMobile()){ closeAgent(); } else { agent.classList.remove('expanded'); overlay.classList.remove('show'); } });

    // ===== Expansao simultanea a acao (sem duplo clique) =====
    // No pointerdown (que precede mousedown->mouseup->click) marcamos .engaged, forcando
    // o input a 100% ANTES do ciclo do click. Assim o botao ja esta na posicao final e o
    // 1o clique dispara a acao normalmente (sem layout shift cancelando o clique).
    // NAO usamos preventDefault/stopPropagation aqui para nao abortar os handlers filhos;
    // a animacao de largura corre em paralelo (transition CSS), sem bloquear a acao.
    inputField.addEventListener('pointerdown', ()=>{ inputField.classList.add('engaged'); }, true);
    // ao perder o foco, se o input estiver ocioso (sem texto/anexo/gravacao), recolhe de volta
    inputField.addEventListener('focusout', ()=>{
      setTimeout(()=>{
        if (inputField.contains(document.activeElement)) return;
        var ocioso = !inputField.classList.contains('recording')
                  && !inputField.classList.contains('has-image')
                  && !textInput.value.trim() && !pendingImage;
        if (ocioso) inputField.classList.remove('engaged');
      }, 0);
    });

    // texto: digitar faz sumir; apagar tudo faz a saudacao voltar (se nao ha conversa)
    textInput.addEventListener('input', ()=>{ updateInputState(); if(textInput.value.length) startChat(); else maybeResetWelcome(); });
    textInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && (textInput.value.trim() || pendingImage)){ sendText(); } });
    // enviar texto/imagem (seta que coexiste no lugar do mic quando ha conteudo)
    function sendText(){
      var t=textInput.value.trim();
      if(!t && !pendingImage) return;
      sendUserMessage(t, pendingImage);
      textInput.value='';
      pendingImage=null; attachThumb.removeAttribute('src'); attachPreview.hidden=true;
      inputField.classList.remove('has-image');
      updateInputState();
    }
    btnSendText.addEventListener('pointerdown', (e)=>{ e.preventDefault(); sendText(); });

    // ===== Pílulas de atalho da drawer =====
    // Status do pedido, Estorno e Cancelamento exigem autenticação -> redirecionam para o
    // login do Portal do Cliente. Dúvidas segue o fluxo normal de mensagem no chat.
    // A decisão usa o atributo data-text (estável) em vez do texto visível, que podia
    // conter espaços/ícone e falhar na comparação.
    (function(){
      // Tela de login local do protótipo (Portal do Cliente).
      var LOGIN_URL = 'pages/portal/portal-login.html';
      // data-text das pílulas que EXIGEM autenticação:
      var EXIGE_LOGIN = {
        'Quero saber o status do meu pedido': true,   // Status do pedido
        'Preciso de informações sobre estorno': true, // Estorno
        'Quero solicitar um cancelamento': true       // Cancelamento
      };
      // Card de login (conversão do "Agente Open () login.svg") exibido no chat.
      function cardLoginHTML(){
        return `<div class="login-card">
          <p class="login-card__text">Para que eu possa continuar te ajudando, <strong>é necessário que você entre ou crie uma conta</strong></p>
          <a class="login-card__btn" id="btnEntrarAgente" href="${LOGIN_URL}" target="_top" role="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Entrar
          </a>
        </div>`;
      }
      function irParaLogin(){
        try { (window.top || window).location.href = LOGIN_URL; }
        catch(err){ window.location.href = LOGIN_URL; }
      }
      var pillsWrap = document.getElementById('pills');
      if(!pillsWrap) return;
      pillsWrap.addEventListener('click', function(e){
        var pill = e.target.closest('.pill');
        if(!pill || !pillsWrap.contains(pill)) return;
        var texto = (pill.getAttribute('data-text') || '').trim();

        // Pílulas que exigem login: se NÃO autenticado, mostra DIRETAMENTE o card de login
        // (sem o "Trabalhando na melhor resposta"). Só ecoa a solicitação e exibe o card.
        if (EXIGE_LOGIN[texto] && !clienteAutenticado()) {
          startChat();
          if (texto) addMessage(escapeHtml(texto), 'user');   // eco da solicitação (sem processamento)
          addMessage(cardLoginHTML(), 'bot');                 // card com botão "Entrar"
          var btn = document.getElementById('btnEntrarAgente');
          if (btn) btn.addEventListener('click', function(ev){ ev.preventDefault(); irParaLogin(); });
          return;
        }
        // Autenticado (ou pílula sem exigência, ex.: Dúvidas): segue o fluxo normal de mensagem.
        if(texto) sendUserMessage(texto);
      });
    })();

    // áudio: iniciar gravacao faz sumir a saudacao.
    // Usamos pointerdown (nao click) porque o input em 70% esta centralizado e, ao expandir
    // para 100%, o botao (na borda direita) se desloca para longe do cursor — o que cancelava
    // o click nativo e exigia um 2o clique. No pointerdown a acao dispara ANTES do reflow,
    // independentemente de o botao sair de baixo do cursor. preventDefault evita roubo de foco.
    btnMic.addEventListener('pointerdown', (e)=>{ e.preventDefault(); inputField.classList.add('engaged','recording'); startChat(); });
    // botao quadrado = interromper: transcreve o audio para dentro do input
    btnStop.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      inputField.classList.remove('recording');
      textInput.value = AUDIO_TRANSCRICAO;      // transcricao vai para o campo
      updateInputState();                        // mic -> enviar
      startChat();
      textInput.focus({preventScroll:true});
    });
    // seta = enviar audio: envia o texto transcrito (nao o literal "Áudio enviado")
    btnSend.addEventListener('pointerdown', (e)=>{ e.preventDefault(); inputField.classList.remove('recording'); sendUserMessage(AUDIO_TRANSCRICAO); });

    // (3) botao "+" abre/fecha o menu de anexo.
    // pointerdown (nao click) pelo mesmo motivo do microfone: o botao fica na borda e
    // se desloca ao expandir; no pointerdown o menu abre no 1o toque, antes do reflow.
    btnAdd.addEventListener('pointerdown', (e)=>{ e.preventDefault(); e.stopPropagation(); inputField.classList.add('engaged'); attachMenu.classList.toggle('open'); });
    // fecha o menu ao clicar fora (ignora o proprio botao, tratado via pointerdown acima)
    document.addEventListener('pointerdown', (e)=>{ if(attachMenu.classList.contains('open') && !attachMenu.contains(e.target) && e.target!==btnAdd && !btnAdd.contains(e.target)) attachMenu.classList.remove('open'); });

    // itens do menu: todos abrem o seletor de arquivo (camera/galeria/arquivos -> mesmo input no desktop)
    attachMenu.querySelectorAll('.attach-menu__item').forEach(item=>{
      item.addEventListener('pointerdown', (e)=>{ e.preventDefault(); e.stopPropagation(); attachMenu.classList.remove('open'); fileInput.click(); });
    });

    // processa UM arquivo (imagem -> preview; outro tipo -> texto pendente).
    // reutilizado pelo seletor de arquivo, pelo drag & drop e pelo colar (paste).
    function processFile(f){
      if(!f) return;
      if(f.type.indexOf('image/')===0){
        const reader = new FileReader();
        reader.onload = ev=>{
          pendingImage = ev.target.result;
          attachThumb.src = pendingImage;
          attachPreview.hidden = false;
          inputField.classList.add('has-image');   // (14) layout empilhado + cantos 24px
          updateInputState();                  // mic -> enviar
          startChat();
          textInput.focus({preventScroll:true});
        };
        reader.readAsDataURL(f);
      } else {
        // nao-imagem: mantem como texto pendente
        textInput.value = '📎 '+f.name;
        updateInputState(); startChat(); textInput.focus({preventScroll:true});
      }
    }

    // (4) arquivo selecionado -> preview da imagem no input, com opcao de remover
    fileInput.addEventListener('change', ()=>{
      const f = fileInput.files && fileInput.files[0];
      if(!f){ maybeResetWelcome(); return; }
      processFile(f);
      fileInput.value='';
    });

    // ===== Drag & drop de anexos sobre o input =====
    ['dragenter','dragover'].forEach(evt=>{
      inputField.addEventListener(evt, (e)=>{
        if(agent.classList.contains('processing')) return;
        e.preventDefault(); e.stopPropagation();
        inputField.classList.add('dragover');
      });
    });
    ['dragleave','dragend'].forEach(evt=>{
      inputField.addEventListener(evt, (e)=>{
        e.preventDefault(); e.stopPropagation();
        // só remove se o ponteiro realmente saiu do input (evita flicker sobre filhos)
        if(!inputField.contains(e.relatedTarget)) inputField.classList.remove('dragover');
      });
    });
    inputField.addEventListener('drop', (e)=>{
      e.preventDefault(); e.stopPropagation();
      inputField.classList.remove('dragover');
      if(agent.classList.contains('processing')) return;
      inputField.classList.add('engaged');     // mantem expandido apos soltar
      const dt = e.dataTransfer;
      if(dt && dt.files && dt.files.length){
        processFile(dt.files[0]);              // anexa o primeiro arquivo solto
      } else if(dt){
        const txt = dt.getData('text');        // texto arrastado
        if(txt){ textInput.value += txt; updateInputState(); startChat(); textInput.focus({preventScroll:true}); }
      }
    });

    // ===== Colar (paste) da area de transferencia: imagem, arquivo ou texto =====
    inputField.addEventListener('paste', (e)=>{
      if(agent.classList.contains('processing')) return;
      inputField.classList.add('engaged');     // expande ao receber conteudo colado
      const cd = e.clipboardData || window.clipboardData;
      if(!cd) return;
      // 1) arquivo/imagem na area de transferencia
      if(cd.files && cd.files.length){
        e.preventDefault();
        processFile(cd.files[0]);
        return;
      }
      // 2) itens (ex.: print de tela colado como image/png)
      if(cd.items && cd.items.length){
        for(const it of cd.items){
          if(it.kind === 'file'){
            const f = it.getAsFile();
            if(f){ e.preventDefault(); processFile(f); return; }
          }
        }
      }
      // 3) texto puro: deixa o comportamento nativo inserir no campo,
      //    apenas garante os estados (enviar/started)
      setTimeout(()=>{ updateInputState(); if(textInput.value.trim()) startChat(); }, 0);
    });

    // remover o anexo pendente -> input volta ao tamanho/cantos originais
    attachRemove.addEventListener('pointerdown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      pendingImage = null; attachThumb.removeAttribute('src'); attachPreview.hidden = true;
      inputField.classList.remove('has-image','engaged');
      updateInputState(); maybeResetWelcome();
    });

    function scrollToBottom(){ chatScroll.scrollTop = chatScroll.scrollHeight; }
    function addMessage(html, who){ const el=document.createElement('div'); el.className='msg '+who; el.innerHTML=html; agentBody.appendChild(el); scrollToBottom(); return el; }

    // envia mensagem do usuario; img = dataURL opcional
    function sendUserMessage(t, img){
      startChat();
      // (20) o anexo vai SEPARADO do balao de texto, mesmo quando enviados juntos
      if(img){ addMessage(`<img class="sent-img" src="${img}" alt="Imagem enviada">`, 'user attachment'); }
      if(t){ addMessage(escapeHtml(t), 'user'); }
      updateInputState();
      startProcessing(t, img);
    }

    // (5) resposta com card de produto (quando ha imagem ou contexto de produto)
    function respostaComProduto(){
      return `Prontinho! Aqui estão as informações sobre o produto:<br><br>
        <strong>O que é?</strong><br>
        Este produto é o <strong>Aptamil Pepti</strong>, fabricado pela <strong>Danone</strong>.
        <div class="product-card">
          <img class="product-card__img js-zoom" src="${PRODUTO_IMG}" alt="Fórmula Infantil Aptamil Pepti 0-3 Anos 800g">
          <div class="product-card__info">
            <p class="product-card__name">Fórmula Infantil Aptamil Pepti 0-3 Anos 800g</p>
            <p class="product-card__price">R$ 301,99 <small>ou 6x de R$ 53,91 c/ juros</small></p>
          </div>
        </div>`;
    }

    function startProcessing(sol, img){
      agent.classList.add('processing');
      const b=addMessage(`<span class="dot-wave"><span></span><span></span><span></span></span> Trabalhando na melhor resposta.`,'typing');
      setTimeout(()=>{
        b.remove(); agent.classList.remove('processing');
        if(img){ addMessage(respostaComProduto(), 'bot'); }
        else { addMessage('Prontinho! Já localizei as informações da sua solicitação. 🙂','bot'); }
        textInput.focus({preventScroll:true});
      }, 2200);
    }

    // (6) clique em qualquer imagem (enviada ou recebida) abre o modal
    agentBody.addEventListener('click', e=>{
      const t=e.target;
      if(t && t.tagName==='IMG' && (t.classList.contains('sent-img') || t.classList.contains('js-zoom'))){
        imgModalImg.src = t.src;
        imgModal.classList.add('open');
        imgModal.setAttribute('aria-hidden','false');
      }
    });
    function closeImgModal(){ imgModal.classList.remove('open'); imgModal.setAttribute('aria-hidden','true'); }
    imgModalClose.addEventListener('click', closeImgModal);
    imgModalBackdrop.addEventListener('click', closeImgModal);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && imgModal.classList.contains('open')) closeImgModal(); });
    // salvar: baixa a imagem
    // mostra a mensagem de feedback (SVG) por alguns instantes
    let feedbackTimer = null;
    function showFeedback(svg){
      imgFeedbackImg.src = 'assets/images/'+svg;
      imgFeedback.classList.add('show');
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(()=> imgFeedback.classList.remove('show'), 1800);
    }
    // salvar: baixa a imagem + feedback
    imgSave.addEventListener('click', ()=>{
      const a=document.createElement('a'); a.href=imgModalImg.src; a.download='imagem'; document.body.appendChild(a); a.click(); a.remove();
      showFeedback('Feedback_Save.svg');
    });
    // copiar: copia a imagem para a area de transferencia + feedback
    imgCopy.addEventListener('click', async ()=>{
      try{
        const res=await fetch(imgModalImg.src); const blob=await res.blob();
        await navigator.clipboard.write([new ClipboardItem({[blob.type]: blob})]);
      }catch(err){ /* navegador pode bloquear copia de imagem */ }
      showFeedback('Feedback_Copy.svg');
    });

    function resumo(t){ return t.length>36 ? t.slice(0,36)+'…' : t; }
    function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  </script>
</body>
